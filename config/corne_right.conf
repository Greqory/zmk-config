# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Peripheral role (right half connected via TRRS)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Disable Studio on peripheral (no USB/BLE RPC transport available)
CONFIG_ZMK_STUDIO=n

# >>> TEMPORARY: USB logging for diagnostics <<<
# Connect right side via USB to read serial console output
# Remove these lines after debugging is complete
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=y